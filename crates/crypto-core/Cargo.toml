[package]
name = "crypto-core"
description = "urkey key derivation, encryption and envelope formats (crypto design v1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true


[features]
# Exposes explicit-nonce/seed variants for generating and checking test vectors.
# Refused in release builds (see lib.rs). Never enable in shipped binaries.
test-vectors = []

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
# Not used directly: enables zeroization of HKDF's internal HMAC state.
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11.2", default-features = false, features = ["zeroize"] }
thiserror = { version = "2.0.21", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false }
zeroize = { version = "1.9.2", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
# Pinned to match wasm-bindgen =0.2.130 and the installed wasm-bindgen-cli test runner.
js-sys = "=0.3.107"
wasm-bindgen-test = "=0.3.80"
