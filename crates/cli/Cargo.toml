[package]
name = "urkey-cli"
description = "urkey command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "urk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
rpassword = "7.5.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-agent = { path = "../ssh-agent" }
sync-core.workspace = true
# OS trust store (Keychain on macOS) instead of a bundled CA list; ring as the rustls provider.
ureq = { version = "3.5.2", default-features = false, features = ["json", "platform-verifier", "rustls-no-provider", "_ring"] }
zeroize = "1.9.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
