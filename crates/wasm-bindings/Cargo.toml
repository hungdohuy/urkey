[package]
name = "wasm-bindings"
description = "Narrow WebAssembly API over the urkey core for the web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sync-core.workspace = true
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
# binaryen 108 (the version apt provides) breaks wasm-bindgen 0.2.130 reference-types tables;
# rustc release + LTO output is used as is.
wasm-opt = false
