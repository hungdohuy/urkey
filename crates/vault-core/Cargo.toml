[package]
name = "vault-core"
description = "urkey vault items, TOTP, password generator and SSH key parsing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
crypto-core.workspace = true
getrandom = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
signature = "3.0.0"
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["alloc", "std", "ed25519", "p256", "encryption", "getrandom"] }
thiserror = "2.0.21"
zeroize = { version = "1.9.2", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
