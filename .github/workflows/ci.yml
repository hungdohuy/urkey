name: CI

# Two jobs. Linux runs the same `scripts/dev.sh check` you run locally, which covers Rust,
# crypto vectors (native, WASM, Python), dependency audits, web and worker checks, reproducible
# build, deploy dry runs, and end to end (CLI + agent + sshd, Playwright). macOS builds and tests
# the CLI and agent, where platform differences (Keychain, socket paths) show up.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CF_SEND_TELEMETRY: "false"

jobs:
  linux:
    name: Linux (scripts/dev.sh check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1,wasm-bindgen-cli@0.2.130,cargo-deny
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System packages (OpenSSH for the agent end-to-end test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client openssh-server
          sudo mkdir -p /run/sshd
          # sshd (UsePAM no) refuses public-key logins for accounts with a locked password.
          sudo usermod -p '*' "$USER"
          pip install -q -r tests/interop/python/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm wasm
      - run: scripts/dev.sh check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  macos:
    name: macOS (CLI + agent)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p urkey-cli -p ssh-agent --all-targets -- -D warnings
      - run: cargo test -p vault-core -p sync-core -p ssh-agent -p urkey-cli
      - run: cargo build --release -p urkey-cli && ./target/release/urk --version
