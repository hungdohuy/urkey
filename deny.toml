# cargo-deny configuration (requirement R-SEC-5, threat model T-15).
# Adding a licence to the allow-list or an advisory to `ignore` needs a reason in the PR.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# Unmaintained or yanked crates are errors too; add `ignore` entries only with a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Workspace crates are private (publish = false) and ignored.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory of what is used today.
unused-allowed-license = "allow"

# webpki-root-certs (Mozilla CA list, CDLA-Permissive-2.0) is only pulled in by
# rustls-platform-verifier on wasm32, a target the CLI is never built for. Native builds use the
# OS trust store.
exceptions = [
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# OpenSSL must not enter the dependency tree; use RustCrypto (CLAUDE.md security rules).
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
